# =============================================================================
# Kernec Boot Configuration
# =============================================================================
#
# Bootloader : Limine
# Architecture : x86_64
# Firmware : UEFI
#
# This file configures Limine and tells it which kernel image to load.
#
# =============================================================================

TIMEOUT=3

:Kernec

    COMMENT=Kernec Development Kernel

    PROTOCOL=limine

    KERNEL_PATH=boot:///kernec.elf

    KASLR=no
